<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superstitions, Zodiac & Friday the 13th | A2 Speaking Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1E1B4B 0%, #0F172A 60%, #090D16 100%);
            overflow: hidden;
        }

        /* Subtle mystical background stars */
        .star-bg {
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, rgba(253, 224, 71, 0.35), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 140px, rgba(255, 255, 255, 0.25), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 80px, rgba(94, 234, 212, 0.25), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 260px 210px, rgba(253, 224, 71, 0.25), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 340px 50px, rgba(255, 255, 255, 0.2), rgba(0,0,0,0));
            background-size: 380px 260px;
        }

        /* Smooth slide card transition */
        .slide-enter {
            animation: slideFadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body class="h-screen w-screen text-slate-100 star-bg flex flex-col justify-between select-none">

    <!-- Top Header Bar -->
    <header class="w-full max-w-6xl mx-auto px-4 sm:px-8 pt-4 sm:pt-6 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-amber-400/15 border border-amber-400/30 flex items-center justify-center text-amber-300 shadow-inner">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                </svg>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-bold tracking-wide text-slate-100">Superstitions, Zodiac & Friday the 13th</h1>
                <p class="text-xs text-teal-300/80 font-medium">A2 Speaking Practice • Modals of Obligation & Advice</p>
            </div>
        </div>

        <!-- Slide Progress Counter & Dots -->
        <div class="flex items-center gap-4">
            <div id="progress-dots" class="hidden md:flex items-center gap-1.5"></div>
            <div class="px-3.5 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/80 text-xs sm:text-sm font-semibold text-amber-300 shadow-sm">
                Situation <span id="slide-counter">1 / 10</span>
            </div>
        </div>
    </header>

    <!-- Main Center Presentation Area -->
    <main class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-8 flex items-center justify-center relative my-2 overflow-hidden">
        
        <!-- Left Navigation Arrow -->
        <button id="prev-btn" onclick="prevSlide()" aria-label="Previous Situation"
            class="group mr-2 sm:mr-5 p-3 sm:p-4 rounded-2xl bg-slate-800/70 hover:bg-slate-700/90 border border-slate-700/80 hover:border-amber-400/50 text-slate-300 hover:text-amber-300 transition-all duration-200 shadow-lg disabled:opacity-30 disabled:pointer-events-none flex-shrink-0 cursor-pointer">
            <svg class="w-6 h-6 sm:w-7 sm:h-7 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
        </button>

        <!-- Central Situation Card -->
        <div id="card-container" class="w-full max-w-4xl bg-slate-900/85 backdrop-blur-xl border border-slate-700/80 rounded-3xl shadow-2xl shadow-black/50 p-5 sm:p-8 lg:p-10 flex flex-col justify-between max-h-[82vh] overflow-y-auto">
            <!-- Dynamic Slide Content Injected Here -->
        </div>

        <!-- Right Navigation Arrow -->
        <button id="next-btn" onclick="nextSlide()" aria-label="Next Situation"
            class="group ml-2 sm:ml-5 p-3 sm:p-4 rounded-2xl bg-slate-800/70 hover:bg-slate-700/90 border border-slate-700/80 hover:border-amber-400/50 text-slate-300 hover:text-amber-300 transition-all duration-200 shadow-lg disabled:opacity-30 disabled:pointer-events-none flex-shrink-0 cursor-pointer">
            <svg class="w-6 h-6 sm:w-7 sm:h-7 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
        </button>

    </main>

    <!-- Bottom Keyboard Hint Bar -->
    <footer class="w-full max-w-6xl mx-auto px-4 sm:px-8 pb-4 flex items-center justify-between text-xs text-slate-400">
        <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono">←</span>
            <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono">→</span>
            <span>Use arrow keys or buttons to switch situations</span>
        </div>
        <div class="hidden sm:block text-slate-400">
            Target Grammar: <span class="text-teal-300 font-medium">must / mustn't • have to / don't have to • should / shouldn't • be supposed to</span>
        </div>
    </footer>

    <script>
        // 10 A2-Level Speaking Situations Data (Strictly 2 discussion questions per card)
        const situations = [
            {
                id: 1,
                category: "Tarot & Birthdays",
                title: "Tarot Cards at Marta's Birthday",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M12 8l1.2 2.5L16 11l-2 2 .5 2.7-2.5-1.3-2.5 1.3.5-2.7-2-2 2.8-.5L12 8z"/></svg>`,
                scenario: "It is Marta's birthday party tonight. Her friends want to read Tarot cards to predict her future in love and work. Marta is a little nervous because she believes predictions can come true.",
                questions: [
                    "What should or shouldn't Marta's friends do during the Tarot reading?",
                    "What mustn't they say to Marta, and does she have to believe the cards?"
                ],
                starters: [
                    "Her friends should / shouldn't...",
                    "They mustn't tell her...",
                    "Marta doesn't have to...",
                    "At a birthday party, friends are supposed to..."
                ],
                vocab: ["predict the future", "nervous", "come true", "have fun", "take seriously"]
            },
            {
                id: 2,
                category: "Friday the 13th",
                title: "A Black Cat on Friday the 13th",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 4l2.5 3.5h7L18 4v6.5c0 4.5-2.8 8.5-6 8.5s-6-4-6-8.5V4z"/><circle cx="9.5" cy="11.5" r="1" fill="currentColor"/><circle cx="14.5" cy="11.5" r="1" fill="currentColor"/><path stroke-linecap="round" d="M10.5 15l1.5 1 1.5-1"/></svg>`,
                scenario: "Leo is walking to an important job interview on Friday the 13th. Suddenly, a big black cat runs across the street right in front of him! Leo is very superstitious and wants to go back home.",
                questions: [
                    "What should Leo do right now, and what mustn't he do before his interview?",
                    "What are people supposed to do when they see a black cat in your country?"
                ],
                starters: [
                    "Leo shouldn't go back home because...",
                    "He must arrive on time and...",
                    "He mustn't cancel...",
                    "In my country, you are supposed to..."
                ],
                vocab: ["job interview", "superstitious", "cross the street", "bad luck", "stay calm"]
            },
            {
                id: 3,
                category: "Mirrors & Bad Luck",
                title: "Breaking a Mirror Before a Date",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><ellipse cx="12" cy="10" rx="6" ry="7.5"/><path stroke-linecap="round" d="M12 17.5V21M9 21h6M9.5 7l4 4m-1.5 1.5l2.5-2.5"/></svg>`,
                scenario: "Anna is getting ready for her first date with a guy she really likes. She drops her small pocket mirror, and it breaks into seven pieces! Her grandmother always said a broken mirror brings seven years of bad luck.",
                questions: [
                    "What must Anna do first with the broken glass, and what shouldn't she worry about?",
                    "How are you supposed to 'cancel' the bad luck when you break a mirror?"
                ],
                starters: [
                    "First, Anna must clean up...",
                    "She mustn't touch...",
                    "She shouldn't worry about...",
                    "To cancel bad luck, you are supposed to..."
                ],
                vocab: ["pocket mirror", "broken glass", "seven years of bad luck", "first date", "be careful"]
            },
            {
                id: 4,
                category: "Zodiac & Love",
                title: "Zodiac Compatibility Problems",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l2.2 4.5 5 .7-3.6 3.5.8 5-4.4-2.3-4.4 2.3.8-5-3.6-3.5 5-.7L12 3z"/></svg>`,
                scenario: "Max is a Leo, and his new girlfriend Sophie is a Scorpio. Max reads a horoscope online that says: 'Leos and Scorpios are a terrible match and always argue!' Now Max is thinking about ending the relationship.",
                questions: [
                    "Should Max trust the online horoscope, or what should he do instead?",
                    "What must a couple do to stay happy, and do partners have to have compatible zodiac signs?"
                ],
                starters: [
                    "Max shouldn't break up with Sophie because...",
                    "A happy couple must...",
                    "Partners don't have to...",
                    "In a relationship, people are supposed to..."
                ],
                vocab: ["zodiac sign", "terrible match", "argue", "trust", "relationship"]
            },
            {
                id: 5,
                category: "Street Superstitions",
                title: "Walking Under a Ladder",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3L5 21M19 3l-3 18M7.2 8h11M6.4 13h11M5.6 18h11"/></svg>`,
                scenario: "Tom is late for his university exam. On the street, a painter is working on a tall ladder right over the sidewalk. To walk around the ladder, Tom has to step onto a busy road, or he can walk straight under it.",
                questions: [
                    "What must Tom do to stay safe, and what mustn't he do on a busy street?",
                    "What are people supposed to do instead of walking under a ladder?"
                ],
                starters: [
                    "To stay safe, Tom must...",
                    "He mustn't step onto...",
                    "He shouldn't worry about...",
                    "People are supposed to walk around..."
                ],
                vocab: ["sidewalk", "busy road", "stay safe", "painter", "in a hurry"]
            },
            {
                id: 6,
                category: "Table Manners & Omens",
                title: "Spilling Salt at a Family Dinner",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 8h8l1 11a2 2 0 01-2 2H9a2 2 0 01-2-2L8 8zM9 8V6a3 3 0 016 0v2"/><circle cx="11" cy="5.5" r="0.6" fill="currentColor"/><circle cx="13" cy="5.5" r="0.6" fill="currentColor"/></svg>`,
                scenario: "David is having dinner at his girlfriend's parents' house for the first time. He accidentally knocks over the salt shaker, and white salt spills all over the table. His girlfriend's mother looks shocked because she believes spilled salt brings an argument.",
                questions: [
                    "What is David supposed to do with the spilled salt according to tradition?",
                    "What should he say to her mother, and what mustn't he do at the dinner table?"
                ],
                starters: [
                    "According to tradition, he is supposed to throw...",
                    "He should apologize and...",
                    "At the dinner table, you mustn't...",
                    "He doesn't have to feel..."
                ],
                vocab: ["spill salt", "over his left shoulder", "argument", "apologize", "polite"]
            },
            {
                id: 7,
                category: "Home Superstitions",
                title: "Opening an Umbrella Indoors",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4a8 8 0 018 8H4a8 8 0 018-8zm0 0V2m0 10v6a2 2 0 004 0"/></svg>`,
                scenario: "Kate just bought a bright yellow umbrella. It isn't raining, so she opens it inside her friend's small apartment to show how nice it looks. Her friend gasps because opening an umbrella indoors is a classic sign of bad luck.",
                questions: [
                    "What must Kate do immediately, and why shouldn't people open umbrellas inside?",
                    "Does Kate have to apologize to her friend, or is it just a silly superstition?"
                ],
                starters: [
                    "Kate must close the umbrella...",
                    "You shouldn't open an umbrella indoors because...",
                    "She mustn't break anything in...",
                    "You are only supposed to open an umbrella..."
                ],
                vocab: ["indoors", "gasp", "close immediately", "small apartment", "outside"]
            },
            {
                id: 8,
                category: "Unlucky Number 13",
                title: "Friday the 13th Flight",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 14l9-3 9-6-2 4-6 4 1 6-2 1-2-5-4 2-2-1 1-2z"/></svg>`,
                scenario: "Sarah finds super cheap plane tickets to Rome, Italy—a place she has always dreamed of visiting. Then she notices the flight is on Friday the 13th, and her seat number is 13A. Her sister tells her not to buy the ticket.",
                questions: [
                    "Should Sarah buy the cheap ticket, or should she listen to her sister?",
                    "What must you check before booking a flight, and do airlines have to skip row 13?"
                ],
                starters: [
                    "Sarah should buy the ticket because...",
                    "Before booking a flight, you must check...",
                    "Airlines don't have to...",
                    "She shouldn't miss a cheap trip to..."
                ],
                vocab: ["plane ticket", "seat number", "book a flight", "passport", "dream destination"]
            },
            {
                id: 9,
                category: "Daily Horoscopes",
                title: "Checking Horoscopes Every Morning",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l2.5 2.5M4 12H2m20 0h-2M12 4V2m0 20v-2"/></svg>`,
                scenario: "Ben cannot start his day without reading his horoscope. If his horoscope says 'Today is a bad day for money,' he refuses to buy coffee or go shopping. If it says 'Be careful today,' he stays home from the gym.",
                questions: [
                    "What should Ben change about his morning routine, and what mustn't he let horoscopes control?",
                    "What are horoscopes supposed to be—serious rules for life or just entertainment?"
                ],
                starters: [
                    "Ben should stop reading...",
                    "He mustn't let a horoscope control...",
                    "He doesn't have to stay home when...",
                    "Horoscopes are only supposed to be..."
                ],
                vocab: ["morning routine", "refuse", "control your life", "entertainment", "make decisions"]
            },
            {
                id: 10,
                category: "Good Luck Rituals",
                title: "Knocking on Wood Before a Test",
                icon: `<svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 11V6a2 2 0 10-4 0v6l-1.8-1.8a1.8 1.8 0 00-2.5 2.5l4.8 4.8A4 4 0 0013.3 19H16a4 4 0 004-4v-3a2 2 0 10-4 0v1"/></svg>`,
                scenario: "Emma has a big driving test tomorrow morning. She tells her friend, 'I am a great driver, so I am 100% sure I will pass!' Her friend immediately tells her to 'knock on wood' so she doesn't jinx herself.",
                questions: [
                    "What is Emma supposed to do when she says something confident, and what mustn't she forget on the road?",
                    "What must students actually do to pass a driving test in your country?"
                ],
                starters: [
                    "When people say something confident, they are supposed to...",
                    "To pass her driving test, Emma must...",
                    "She shouldn't be too...",
                    "In my country, students have to / don't have to..."
                ],
                vocab: ["driving test", "knock on wood", "jinx yourself", "confident", "traffic rules"]
            }
        ];

        let currentIndex = 0;
        let isHelperOpen = false;

        // Render dots in header
        function renderDots() {
            const dotsContainer = document.getElementById('progress-dots');
            dotsContainer.innerHTML = situations.map((_, idx) => `
                <button onclick="goToSlide(${idx})" aria-label="Go to situation ${idx + 1}"
                    class="h-2 rounded-full transition-all duration-300 cursor-pointer ${
                        idx === currentIndex 
                        ? 'w-6 bg-amber-400' 
                        : 'w-2 bg-slate-600 hover:bg-slate-400'
                    }">
                </button>
            `).join('');
        }

        // Render active situation slide
        function renderSlide() {
            const item = situations[currentIndex];
            const card = document.getElementById('card-container');
            
            // Update counter & nav button states
            document.getElementById('slide-counter').textContent = `${currentIndex + 1} / ${situations.length}`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === situations.length - 1;
            renderDots();

            // Restart entry animation
            card.classList.remove('slide-enter');
            void card.offsetWidth; // trigger reflow
            card.classList.add('slide-enter');

            card.innerHTML = `
                <div>
                    <!-- Top Row: Category Badge & Title -->
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div class="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-amber-400/10 border border-amber-400/25 text-amber-300 text-xs sm:text-sm font-semibold tracking-wide uppercase">
                            ${item.icon}
                            <span>${item.category}</span>
                        </div>
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest">Card #0${item.id === 10 ? '' : ''}${item.id}</span>
                    </div>

                    <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight mb-4">
                        ${item.title}
                    </h2>

                    <!-- Scenario Box -->
                    <div class="bg-slate-800/75 border border-slate-700/70 rounded-2xl p-4 sm:p-6 mb-6">
                        <p class="text-base sm:text-lg lg:text-xl text-slate-100 leading-relaxed font-normal">
                            ${item.scenario}
                        </p>
                    </div>

                    <!-- Discussion Questions -->
                    <div class="mb-6">
                        <h3 class="text-xs sm:text-sm font-bold uppercase tracking-wider text-teal-300 mb-3 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
                            </svg>
                            Discuss the Situation:
                        </h3>
                        <ul class="space-y-2.5">
                            ${item.questions.map((q, i) => `
                                <li class="flex items-start gap-3 text-base sm:text-lg text-slate-200 font-medium">
                                    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-teal-500/20 border border-teal-400/30 text-teal-300 text-xs font-bold flex items-center justify-center mt-0.5">
                                        ${i + 1}
                                    </span>
                                    <span>${q}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>

                <!-- Toggleable Modal Verbs Helper -->
                <div class="pt-3 border-t border-slate-800">
                    <button onclick="toggleHelper()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700/90 border border-slate-700 text-xs sm:text-sm font-semibold text-amber-300 transition-colors cursor-pointer">
                        <svg class="w-4 h-4 transition-transform duration-200 ${isHelperOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                        </svg>
                        <span>${isHelperOpen ? 'Hide Grammar Prompts & Vocabulary' : 'Show Grammar Prompts & Vocabulary'}</span>
                    </button>

                    <div id="helper-box" class="${isHelperOpen ? 'block' : 'hidden'} mt-3 p-4 rounded-2xl bg-slate-950/70 border border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-amber-300/90 mb-2">Useful Modal Starters</p>
                            <ul class="space-y-1 text-xs sm:text-sm text-slate-300">
                                ${item.starters.map(s => `<li class="flex items-center gap-2"><span class="text-amber-400">•</span> ${s}</li>`).join('')}
                            </ul>
                        </div>
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-teal-300/90 mb-2">Key Words for this Situation</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${item.vocab.map(v => `<span class="px-2.5 py-1 rounded-lg bg-teal-500/10 border border-teal-400/20 text-teal-200 text-xs font-medium">${v}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleHelper() {
            isHelperOpen = !isHelperOpen;
            renderSlide();
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide();
            }
        }

        function nextSlide() {
            if (currentIndex < situations.length - 1) {
                currentIndex++;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentIndex = index;
            renderSlide();
        }

        // Keyboard Arrow Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
            }
        });

        // Initial render on load
        window.onload = function() {
            renderSlide();
        };
    </script>
</body>
</html>
